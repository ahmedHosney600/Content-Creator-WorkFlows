        - id: 57ada097-4b5f-46a7-a4d6-6eeb1ef95d23
          role: system
          text: 'You are scheduling the repurposed content pieces into a realistic
            2-week calendar, respecting the stated posting cadence — do not schedule
            more posts than the cadence allows.



            SEQUENCING LOGIC:

            - A short teaser clip (if any) can go 1–2 days BEFORE the main content
            publishes, to build anticipation

            - Core repurposed pieces (thread, carousel, article) typically follow
            the main publish date, spaced across the two weeks — don''t dump them
            all on day one

            - If multiple short clips exist, space them out rather than posting back-to-back

            - Leave natural gaps — a calendar with something scheduled every single
            cadence slot with zero flexibility isn''t realistic



            OUTPUT FORMAT:



            ---



            ## CONTENT CALENDAR (2 Weeks)



            | Day | Date (if known) | Content Piece | Platform | Type |

            |---|---|---|---|---|

            | Day -1 | [date] | [teaser clip, if applicable] | [platform] | Pre-publish
            teaser |

            | Day 0 | [date] | Main video | [original platform] | Main publish |

            | Day X | [date] | [repurposed piece] | [platform] | Post-publish |

            ...



            ### Cadence Check

