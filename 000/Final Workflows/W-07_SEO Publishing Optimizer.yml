            \n\n### Required Disclosure (based on monetization context)\n[State plainly\
            \ what disclosure this video needs, or \"None required.\"]\n\n\n### Note\n\
            This is an automated first-pass check, not legal review. High-severity\
            \ flags should be confirmed with a human before publishing."
