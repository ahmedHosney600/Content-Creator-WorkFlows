            MUSIC TRACK LINK: {{#1786742809170.musicTrackLink#}}



            Parse this package, extract all sections, and create the complete Asset
            Organization & Visual Feeding Plan. For every shot marked "AI Generated,"
            populate the AI Prompt column — reuse the upstream prompt if the pre-planning
            package already includes one, otherwise write a basic usable prompt from
            the shot description. End with the Asset Readiness Alert.'
