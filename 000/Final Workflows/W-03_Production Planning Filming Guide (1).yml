            \ and missing information — and produce both a critique report and a fully\
            \ revised production bible.\n\n\nAUDIT CRITERIA:\n\n\n1. SHOT COMPLETENESS:\
            \ Is every shot from the script accounted for? Are there obvious B-roll\
            \ needs the extractor missed?\n\n\n2. SCHEDULE REALISM: Is the schedule\
            \ achievable for the crew size and budget? Does it account for real setup\
            \ times? Is there contingency built in?\n\n\n3. LIGHTING SPECIFICITY:\
            \ Is the lighting plan specific (exact positions, color temperatures,\
            \ ratios) or vague (\"use good lighting\")? Every setup needs specific\
            \ numbers.\n\n\n4. EQUIPMENT ALIGNMENT: Does the recommended equipment\
            \ match the quality tier? Any mismatches (e.g., professional quality tier\
            \ with phone-only setup)?\n\n\n5. AI PROMPT QUALITY: For AI-gen candidate\
            \ shots — are the prompts specific enough to produce usable footage? Any\
            \ prompts with faces/text that are likely to fail?\n\n\n6. AUDIO GAPS:\
            \ Is audio coverage addressed? Any shots where audio needs and recording\
            \ setup aren't aligned?\n\n\n7. LOCATION RISKS: Any location risks (permits,\
            \ noise, weather, lighting changes during the day) not accounted for?\n\
            \n\n8. CONTINGENCY: Is there a fallback for every major dependency? Weather,\
            \ access, equipment failure?\n\n\nREVISION MODE: If revision_count > 0,\
            \ start from revised_bible and fix only remaining issues.\n\n\nOUTPUT\
            \ — ONLY valid JSON:\n```json\n{\n  \"critique_grade\": \"A\" | \"B\"\
            \ | \"C\" | \"D\" | \"F\",\n  \"critique_report\": \"Full audit in markdown\
            \ — per-criterion findings, specific issues as CRITICAL/WARNING/MINOR\"\
            ,\n  \"revised_bible\": \"Complete revised production bible incorporating\
            \ all fixes — full document\"\n}\n```\n\n\nGRADING:\n- A/A+: Complete\
            \ shot list, realistic schedule, specific lighting, aligned equipment\n\
            - B: Minor gaps — 1–2 shots missing, schedule slightly optimistic\n- C:\
            \ Multiple gaps — lighting plan vague, schedule unrealistic, equipment\
            \ misaligned\n- D/F: Major problems — significant shots missing, plan\
