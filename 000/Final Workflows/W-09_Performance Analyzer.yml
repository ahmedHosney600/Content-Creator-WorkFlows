        prompt_template:
        - id: b3725afe-bb90-400f-aec8-94d0c4308c90
          role: system
          text: 'You are extracting reusable lessons from the prediction-vs-reality
            analysis. This is the step that actually makes the feedback loop worth
            running — a lesson tied to outcome only ("retention was low") teaches
            nothing repeatable; a lesson tied to mechanism ("the pattern interrupt
            at 0:45 didn''t land because the topic shift was too abrupt — no visual
            cue signaled the change") tells the next script/idea what to actually
            do differently.



            THE OUTCOME-VS-MECHANISM TEST — every lesson must pass this before it
            ships:

            - ❌ "Retention was low in the middle section." (outcome only — not reusable)

            - ✅ "The middle section''s retention dropped sharply at the second re-engagement
            hook (2:10) — the hook referenced the open loop verbally but didn''t change
            anything visually, so it read as more of the same rather than a genuine
            pattern interrupt. Future scripts should pair verbal re-hooks with a visual
            or energy shift, not rely on the line alone."

            - ❌ "The hook worked well." (outcome only)

            - ✅ "The hook''s cold-open visual (no intro, straight into the action)
            held retention through the first 15 seconds where prior videos on this
            channel dropped ~20% in the same window. The specific mechanism — starting
            mid-action rather than with a spoken intro — is what to repeat, not just
            ''good hooks.''"



            For each lesson, tag which upstream workflow it''s most relevant to:

            - **[IDEA]** — relevant to W-00''s idea scoring (topic/angle resonance)

            - **[SCRIPT]** — relevant to W-02''s script calibration (hook, pacing,
            retention mechanics, dialect/voice)

            - **[GENERAL]** — relevant to both or to production/editing choices outside
            script scope



            Extract 3–6 lessons. Quality over quantity — three sharp, mechanism-tied
            lessons beat six vague ones.



            OUTPUT FORMAT:



            ---



            ## LESSONS EXTRACTED



            | # | Tag | Lesson |

            |---|---|---|

            | 1 | [IDEA / SCRIPT / GENERAL] | [full mechanism-tied lesson, written
            the way the ✅ examples above are written] |



            ### What Not to Over-Generalize From

            [If this video''s sample size, novelty, or context limits how far these
            lessons should be trusted — say so. A single video''s data point is a
            hypothesis, not a rule.]'
        - id: 51564fd0-8a32-47eb-a3db-958cf9366aaf
          role: user
          text: 'Extract reusable lessons from this analysis.



            PREDICTION VS. REALITY:

            {{#1787052491172.text#}}



            NORMALIZED ANALYTICS:

            {{#1787052471764.text#}}



            Extract 3–6 mechanism-tied lessons, each tagged for which upstream workflow
            it feeds. Every lesson must pass the outcome-vs-mechanism test in your
            instructions — no lesson that just restates the outcome.'
