            \n\nYOUR TASK: Take the script as written and rewrite every line in authentic\
            \ Egyptian colloquial Arabic (عامية مصرية) per the register specified.\n\
            \n\nDIALECT REGISTERS:\n- **Cairene media-standard** (default): The Arabic\
            \ spoken in Egyptian film, TV, and most successful YouTube content. Clean,\
            \ natural, understood across the Arabic-speaking world. Avoids heavy slang\
            \ but still unmistakably Egyptian.\n- **Street & youth slang**: Full entertainment/comedy\
            \ register. Heavy idioms, youth vocabulary, fast rhythm. Only for entertainment\
            \ or comedy content.\n- **Educated professional**: Egyptian grammar throughout;\
            \ slightly more formal vocabulary; the language an Egyptian doctor or\
            \ engineer would use explaining something to a peer. Still colloquial\
            \ — NOT MSA.\n- **Sa'idi**: Upper Egyptian dialect — only use if explicitly\
            \ specified.\n\n\nCORE RULES — NON-NEGOTIABLE:\n\n\n1. NO فصحى conjugation\
            \ or vocabulary. Ever. The following are always wrong in Egyptian colloquial:\n\
            \   - يفعل → must be بيعمل\n   - سأذهب → must be هروح\n   - أريد → must\
            \ be عايز / محتاج\n   - الآن → must be دلوقتي\n   - لكن → must be بس\n\
            \   - كيف → must be إزاي\n   - هذا/ذلك → must be ده/دا\n   - نعم → must\
            \ be أيوه\n   - لا أعرف → must be مش عارف\n\n\n2. SENTENCE RHYTHM: Egyptian\
            \ spoken Arabic uses:\n   - Shorter clauses\n   - More discourse markers:\
            \ يعني / طب / خلاص / على فكرة / بجد / يا جماعة / بصراحة / أصل\n   - A\
            \ conversational stitching style that English scripts don't use\n   -\
            \ Interrogative tone dropped into explanations (\"يعني إيه ده؟ ده معناه\
            \ إن...\")\n\n\n3. CODE-SWITCHING per level specified:\n   - **None**:\
            \ Find Egyptian Arabic equivalent for every term, even technical ones\n\
            \   - **Light**: English nouns for tech, brand, and global-culture terms\
            \ only (الـ engagement, الـ algorithm, subscribe). Never English verbs.\n\
            \   - **Moderate**: Bilingual creator style — English phrases for technical\
            \ sections, Arabic for emotional and narrative sections\n\n\n4. A TRANSLATED\
            \ SCRIPT IS A FAILED SCRIPT: If the rewritten script reads like someone\
            \ translated English into grammatically correct Arabic, it has failed\
            \ — even if every word is technically correct. Egyptian Arabic has its\
            \ own cadence, its own filler words, its own rhythm. Capture that rhythm.\n\
            \n\nCONTRASTIVE REFERENCE TABLE — ALWAYS APPLY:\n| MSA / Translated Version\
            \ (AVOID) | Native Egyptian Version (USE) | Context |\n|---|---|---|\n\
            | كيف حالك؟ | إزيك؟ / عامل إيه؟ | Greeting |\n| أريد أن أتحدث عن... |\
            \ عايز أتكلم عن... | Intro |\n| هذا الأمر مهم جداً | الموضوع ده مهم جداً\
            \ | Emphasis |\n| سأشرح لكم كيف... | هوريكم إزاي... | Explainer opener\
            \ |\n| في الحقيقة | بجد / بصراحة | Sincerity marker |\n| والآن، دعونا\
            \ ننتقل إلى | طب تعالوا بقى نشوف | Transition |\n| يجب عليكم أن تفعلوا\
            \ | لازم تعملوا | Obligation |\n| لقد أجرينا تجربة | عملنا تجربة | Past\
            \ action |\n| وبالتالي | وبكده / فبكده | Consequence |\n| كما ذكرنا سابقاً\
            \ | زي ما قلنا | Callback |\n| على سبيل المثال | مثلاً / زي مثلاً | Example\
            \ marker |\n| بشكل عام | بشكل عام (acceptable) / عموماً / في الغالب |\
            \ Generalization |\n\n\nDIALECT AUTHENTICITY SCORING:\nAfter rewriting,\
            \ score the script on this dimension:\n**Dialect Authenticity Score (1–10)**:\
            \ Would a native Cairene viewer read this and assume a human Egyptian\
