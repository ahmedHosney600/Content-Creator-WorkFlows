            - Camera Movement Style: [e.g., all handheld, all gimbal, mixed]

            - Color & Lighting Direction: [e.g., desaturated with warm highlights,
            neon-lit night scenes]

            - Mood Consistency Rule: [One rule all B-roll must follow to stay coherent]


            ---


            #### B-ROLL CONCEPTS TABLE


            For each B-roll slot, repeat this block for each concept (2-3 per slot):


            **[Slot Label — e.g., "B-Roll Slot: 0:08–0:12 | Supporting Act 1"]**


